<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
    />
    <title>Filemoon</title>
  </head>
  <body>
    <div class="bg-gray-400 min-h-screen">
      <aside
        class="space-y-4 py-4 bg-linear-to-r from-cyan-500 to-blue-500 fixed top-0 left-0 h-full"
        id="sidebar"
        style="width: 250px; transition: 0.5s"
      >
        <div class="flex flex-col items-center">
          <img
            src="../images/Avatar.jpg"
            alt="avatar-image"
            onclick="uploadImage()"
            id="pic"
            class="w-[80px] h-[80px] rounded-full object-cover"
          />
          <h2
            class="text-lg font-medium text-white capitalize"
            id="fullname"
          ></h2>
          <p class="text-sm text-white" id="email"></p>
        </div>
        <div class="px-6 flex gap-2 flex-col">
          <a href="/dashboard">
            <button
              class="w-full py-2 bg-rose-500 text-white rounded hover:bg-rose-700"
            >
              <i class="ri-dashboard-horizontal-fill"></i
              ><label>Dashboard</label>
            </button>
          </a>
          <a href="/files">
            <button
              class="w-full py-2 bg-rose-500 text-white rounded hover:bg-rose-700"
            >
              <i class="ri-file-ai-line"></i><label>My Files</label>
            </button>
          </a>
          <a href="/history">
            <button
              class="w-full py-2 bg-rose-500 text-white rounded hover:bg-rose-700"
            >
              <i class="ri-chat-history-fill"></i>
              <label>History</label>
            </button>
          </a>
          <button
            class="w-full py-2 bg-rose-500 text-white rounded hover:bg-rose-700"
            onclick="logout()"
          >
            <i class="ri-logout-circle-r-line"></i>
            <label>Logout</label>
          </button>
        </div>
      </aside>
      <section id="section" style="margin-left: 250px; transition: 0.5s">
        <nav
          class="bg-white px-6 py-4 w-full shadow-lg flex justify-between items-center"
        >
          <div class="flex items-center gap-2">
            <i class="ri-moon-line text-4xl text-violet-700"></i>
            <h1 class="text-2xl font-semibold">Filemoon</h1>
          </div>

          <div class="space-x-2">
            <button
              class="bg-gray-100 px-4 py-2 rounded-md hover:bg-gray-200 cursor-pointer"
              onclick="logout()"
            >
              <i class="ri-logout-circle-r-line"></i>
            </button>
            <button
              onclick="toggleSidebar()"
              class="bg-gray-100 px-4 py-2 rounded-md hover:bg-gray-200 cursor-pointer"
            >
              <i class="ri-menu-2-line"></i>
            </button>
          </div>
        </nav>
        <div class="p-6 space-y-4">
          <h1 class="text-lg font-medium">Dashboard</h1>
          <div id="report-card" class="grid grid-cols-4 gap-8 mb-8"></div>

          <div class="grid grid-cols-4 gap-8">
            <!--Recent Files-->
            <div
              class="col-span-2 overflow-hidden relative bg-white rounded-lg shadow hover:shadow-lg p-6 space-y-2"
            >
              <h2
                class="text-2xl font-bold text-gray-900 pb-2 border-b border-gray-300"
              >
                Recent Files
              </h2>
              <div id="recent-files-box" class="space-y-4"></div>
            </div>
            <!--Recent Shared-->
            <div
              class="col-span-2 overflow-hidden relative bg-white rounded-lg shadow hover:shadow-lg p-6 space-y-2"
            >
              <h2
                class="text-2xl font-bold text-gray-900 pb-2 border-b border-gray-300"
              >
                Recent Shared
              </h2>
              <div id="recent-shared-box" class="space-y-4"></div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script src="../js/env.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
