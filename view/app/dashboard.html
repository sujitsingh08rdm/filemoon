<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>

    <title>Filemoon</title>
  </head>
  <body>
    <div class="bg-gray-400 min-h-screen">
      <aside
        class="space-y-4 py-4 bg-linear-to-r from-cyan-500 to-blue-500 fixed top-0 left-0 h-full"
        id="sidebar"
        style="width: 250px; transition: 0.5s"
      >
        <div class="flex flex-col items-center">
          <img src="../images/Avatar.jpg" alt="avatar-image" width="80" />
          <h2 class="text-lg font-medium text-white capitalize" id="fullname"></h2>
          <p class="text-sm text-white" id="email"></p>
        </div>
        <div class="px-6 flex gap-2 flex-col">
          <a href="/dashboard">
            <button
              class="w-full py-2 bg-rose-500 text-white rounded hover:bg-rose-700"
            >
              <i class="ri-dashboard-horizontal-fill"></i
              ><label>Dashboard</label>
            </button>
          </a>
          <a href="/files">
            <button
              class="w-full py-2 bg-rose-500 text-white rounded hover:bg-rose-700"
            >
              <i class="ri-file-ai-line"></i><label>My Files</label>
            </button>
          </a>
          <a href="/history">
            <button
              class="w-full py-2 bg-rose-500 text-white rounded hover:bg-rose-700"
            >
              <i class="ri-chat-history-fill"></i>
              <label>History</label>
            </button>
          </a>
          <button
            class="w-full py-2 bg-rose-500 text-white rounded hover:bg-rose-700"
            onclick="logout()"
          >
            <i class="ri-logout-circle-r-line"></i>
            <label>Logout</label>
          </button>
        </div>
      </aside>
      <section id="section" style="margin-left: 250px; transition: 0.5s">
        <nav
          class="bg-white px-6 py-4 w-full shadow-lg flex justify-between items-center"
        >
          <div class="flex items-center gap-2">
            <i class="ri-moon-line text-4xl text-violet-700"></i>
            <h1 class="text-2xl font-semibold">Filemoon</h1>
          </div>

          <div class="space-x-2">
            <button
              class="bg-gray-100 px-4 py-2 rounded-md hover:bg-gray-200 cursor-pointer"
              onclick="logout()"
            >
              <i class="ri-logout-circle-r-line"></i>
            </button>
            <button
              onclick="toggleSidebar()"
              class="bg-gray-100 px-4 py-2 rounded-md hover:bg-gray-200 cursor-pointer"
            >
              <i class="ri-menu-2-line"></i>
            </button>
          </div>
        </nav>
        <div class="p-6 space-y-4">
          <h1 class="text-lg font-medium">Dashboard</h1>
          <div class="grid grid-cols-4 gap-8">
            <div
              class="overflow-hidden relative bg-white rounded-lg shadow hover:shadow-lg h-36 flex items-center justify-center flex flex-col"
            >
              <h2 class="text-2xl font-bold text-gray-600">Videos</h2>
              <p class="text-xl font-semibold text-gray-600">2560</p>
              <div
                class="flex justify-center items-center w-[100px] h-[100px] rounded-full absolute top-5 -left-6"
                style="
                  background-image: linear-gradient(
                    to top,
                    #fbc2eb 0%,
                    #a6c1ee 100%
                  );
                "
              >
                <i class="ri-video-chat-fill text-4xl text-white"></i>
              </div>
            </div>
            <div
              class="overflow-hidden relative bg-white rounded-lg shadow hover:shadow-lg h-36 flex items-center justify-center flex flex-col"
            >
              <h2 class="text-2xl font-bold text-gray-600">Audio</h2>
              <p class="text-xl font-semibold text-gray-600">250</p>
              <div
                class="flex justify-center items-center w-[100px] h-[100px] rounded-full absolute top-5 -left-6"
                style="
                  background-image: linear-gradient(
                    120deg,
                    #92ae51 0%,
                    #64976b 100%
                  );
                "
              >
                <i class="ri-folder-music-fill text-4xl text-white"></i>
              </div>
            </div>
            <div
              class="overflow-hidden relative bg-white rounded-lg shadow hover:shadow-lg h-36 flex items-center justify-center flex flex-col"
            >
              <h2 class="text-2xl font-bold text-gray-600">PDF</h2>
              <p class="text-xl font-semibold text-gray-600">2160</p>
              <div
                class="flex justify-center items-center w-[100px] h-[100px] rounded-full absolute top-5 -left-6"
                style="
                  background-image: linear-gradient(
                    120deg,
                    #a1c4fd 0%,
                    #c2e9fb 100%
                  );
                "
              >
                <i class="ri-file-pdf-2-fill text-4xl text-white"></i>
              </div>
            </div>
            <div
              class="overflow-hidden relative bg-white rounded-lg shadow hover:shadow-lg h-36 flex items-center justify-center flex flex-col"
            >
              <h2 class="text-2xl font-bold text-gray-600">Image</h2>
              <p class="text-xl font-semibold text-gray-600">9010</p>
              <div
                class="flex justify-center items-center w-[100px] h-[100px] rounded-full absolute top-5 -left-6"
                style="
                  background-image: linear-gradient(
                    to top,
                    #a8edea 0%,
                    #fed6e3 100%
                  );
                "
              >
                <i class="ri-file-image-line text-4xl text-white"></i>
              </div>
            </div>
            <div
              class="col-span-2 overflow-hidden relative bg-white rounded-lg shadow hover:shadow-lg p-6"
            >
              <h2 class="text-2xl font-bold text-gray-600">Recent Files</h2>
            </div>
            <div
              class="col-span-2 overflow-hidden relative bg-white rounded-lg shadow hover:shadow-lg p-6"
            >
              <h2 class="text-2xl font-bold text-gray-600">Recent Shared</h2>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script src="../js/env.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
