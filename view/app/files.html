<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
    />
    <title>Filemoon</title>
  </head>
  <body>
    <div class="bg-gray-400 min-h-screen">
      <aside
        class="space-y-4 py-4 bg-linear-to-r from-cyan-500 to-blue-500 fixed top-0 left-0 h-full"
        id="sidebar"
        style="width: 250px; transition: 0.5s"
      >
        <div class="flex flex-col items-center">
          <img src="../images/Avatar.jpg" alt="avatar-image" width="80" />
          <h2 class="text-lg font-medium text-white">Sujit</h2>
          <p class="text-sm text-white">Sujit@gamil.com</p>
        </div>
        <div class="px-6 flex gap-2 flex-col">
          <a href="/dashboard">
            <button
              class="w-full py-2 bg-rose-500 text-white rounded hover:bg-rose-700"
            >
              <i class="ri-dashboard-horizontal-fill"></i
              ><label>Dashboard</label>
            </button>
          </a>
          <a href="/files">
            <button
              class="w-full py-2 bg-rose-500 text-white rounded hover:bg-rose-700"
            >
              <i class="ri-file-ai-line"></i><label>My Files</label>
            </button>
          </a>
          <a href="/history">
            <button
              class="w-full py-2 bg-rose-500 text-white rounded hover:bg-rose-700"
            >
              <i class="ri-chat-history-fill"></i>
              <label>History</label>
            </button>
          </a>
          <button
            class="w-full py-2 bg-rose-500 text-white rounded hover:bg-rose-700"
            onclick="logout()"
          >
            <i class="ri-logout-circle-r-line"></i>
            <label>Logout</label>
          </button>
        </div>
      </aside>
      <section id="section" style="margin-left: 250px; transition: 0.5s">
        <nav
          class="bg-white px-6 py-4 w-full shadow-lg flex justify-between items-center"
        >
          <div class="flex items-center gap-2">
            <i class="ri-moon-line text-4xl text-violet-700"></i>
            <h1 class="text-2xl font-semibold">Filemoon</h1>
          </div>

          <div class="space-x-2">
            <button
              class="bg-gray-100 px-4 py-2 rounded-md hover:bg-gray-200 cursor-pointer"
              onclick="logout()"
            >
              <i class="ri-logout-circle-r-line"></i>
            </button>
            <button
              onclick="toggleSidebar()"
              class="bg-gray-100 px-4 py-2 rounded-md hover:bg-gray-200 cursor-pointer"
            >
              <i class="ri-menu-2-line"></i>
            </button>
          </div>
        </nav>
        <div class="p-6 space-y-4">
          <div class="flex justify-between">
            <h1 class="text-lg font-medium">My Files</h1>
            <button
              onclick="toggleDrawer()"
              class="bg-violet-500 hover:bg-violet-700 text-white px-4 py-2 rounded"
            >
              <i class="ri-add-line"></i><label>Upload</label>
            </button>
          </div>
          <table class="w-full bg-white">
            <thead>
              <tr class="bg-slate-900 text-gray-300 text-left">
                <th class="font-medium py-4 pl-4">Filename</th>
                <th class="font-medium">Type</th>
                <th class="font-medium">Size</th>
                <th class="font-medium">Created</th>
                <th class="font-medium">Action</th>
              </tr>
            </thead>
            <tbody id="file-table"></tbody>
          </table>
        </div>
      </section>
      <div
        class="fixed w-4/12 bg-white shadow-lg top-0 right-0 space-y-4 h-full p-6"
        style="right: -33.33%; transition: 0.5s"
        id="drawer"
      >
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-medium text-gray-600">Upload new file</h2>
          <button onclick="toggleDrawer()">
            <i
              class="ri-close-circle-fill text-gray-600 hover:text-rose-600 text-2xl"
            ></i>
          </button>
        </div>
        <div class="h-px bg-gray-200 -mx-6"></div>
        <form class="space-y-6" onsubmit="uploadFile(event)">
          <div class="flex flex-col gap-2">
            <label class="text-gray-500 font-medium">Filename</label
            ><input
              name="filename"
              type="text"
              required
              class="py-2 px-3 rounded border border-gray-300"
              placeholder="enter filename"
            />
          </div>
          <div class="flex flex-col gap-2">
            <label class="text-gray-500 font-medium">Choose a File</label
            ><input
              type="file"
              name="file"
              required
              class="py-2 px-3 rounded border border-gray-300"
            />
          </div>
          <button
            id="upload-btn"
            class="px-4 py-2 bg-rose-400 hover:bg-rose-600 text-white rounded font-medium"
          >
            Upload
          </button>
        </form>
        <div class="bg-gray-200 h-4">
          <div
            class="h-full bg-green-400 text-xs text-gray-900 text-center"
            style="width: 0"
            id="progress"
          ></div>
        </div>
      </div>
    </div>

    <script src="../js/env.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/files.js"></script>
    <script src="../js/layout.js"></script>
  </body>
</html>
